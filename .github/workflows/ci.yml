name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The app reads settings from .env (gitignored); CI uses placeholders.
      - run: cp .env.ci .env
      - run: npx tsc --noEmit -p .
      - run: npx jest --ci --maxWorkers=2
