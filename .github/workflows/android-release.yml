name: Android release

# One click (Actions → Android release → Run workflow): builds the signed .aab
# and sends it to a Google Play track. Nothing runs on push.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (draft until the app's first review is through)"
        type: choice
        options: [draft, completed]
        default: draft

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Each run is one higher than the last; 3 is the first after the hand-built 2.
      # (Workflow expressions can't add, so the shell does.)
      - name: Set the build number
        run: echo "ANDROID_VERSION_CODE=$(( ${{ github.run_number }} + 2 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check secrets are set
        env:
          ENV_FILE: ${{ secrets.MOBILE_ENV_PRODUCTION }}
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in ENV_FILE KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_JSON; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          exit $missing

      - run: npm ci

      - name: Write .env and the upload key
        env:
          ENV_FILE: ${{ secrets.MOBILE_ENV_PRODUCTION }}
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      # android/ isn't in git: generate it from app.json and the config plugins.
      - run: npx expo prebuild --platform android --no-install

      # Prebuild caps Gradle at 512 MB of Metaspace, which release lint runs out of
      # with this many native modules. The runner has 16 GB.
      - name: Give Gradle more memory
        run: |
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Build the signed .aab
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_TURNUPZ_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          ORG_GRADLE_PROJECT_TURNUPZ_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TURNUPZ_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_TURNUPZ_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        # Real phones (arm64, armv7) and Chromebooks (x86_64); 32-bit x86 is emulators only.
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: turnupz-${{ env.ANDROID_VERSION_CODE }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Send to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.turnupz.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" .env
